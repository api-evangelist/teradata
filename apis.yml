aid: teradata
name: Teradata
description: Teradata provides enterprise analytics and data management solutions. The Teradata VantageCloud platform delivers
  connected multi-cloud data analytics with capabilities for data warehousing, advanced analytics, and machine learning at
  scale. Teradata offers REST APIs for managing QueryGrid data fabric connections, running SQL queries, and administering
  platform resources.
