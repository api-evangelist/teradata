  - aid: teradata:query-service-api
    name: Teradata Query Service API
    description: REST API for executing SQL queries against Teradata Vantage systems. Provides HTTP-based access to run queries,
      retrieve results, and manage sessions for application integration and browser-based query tools.
    humanURL: https://docs.teradata.com
    baseURL: https://vantage.teradata.com/api/query/v1
    tags:
