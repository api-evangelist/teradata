apis:
  - aid: teradata:querygrid-manager-api
    name: Teradata QueryGrid Manager API
    description: REST API for centralized administration and monitoring of Teradata QueryGrid, the data fabric that enables
      seamless cross-system analytics. Manage data centers, systems, bridges, connectors, links, fabrics, networks, and node
      configurations. Perform diagnostic checks, software installations, and query monitoring across connected systems.
    humanURL: https://github.com/Teradata/querygrid-apidocs
    baseURL: https://querygrid.teradata.com/api/v1
    tags:
    - Configuration
    - Data Fabric
    - Diagnostics
    - Monitoring
    - QueryGrid
