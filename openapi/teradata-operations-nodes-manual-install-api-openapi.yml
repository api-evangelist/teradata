openapi: 3.2.0
info:
  description: Teradata QueryGrid™ Manager provides APIs for centralized administration and monitoring of Teradata QueryGrid.
  title: Teradata QueryGrid Manager Operations - Nodes Manual…
  version: '03.08'
servers:
- description: Default API endpoint
  url: /api/v1
- description: Querygrid Prefix API endpoint
  url: /querygrid/api/v1
- description: Streaming Prefix API endpoint
  url: /querygrid-streaming/api/v1
security:
- BasicAuth: []
tags:
- description: Download config file needed for manual install and registration of nodes with QueryGrid Manager
  name: Operations - Nodes Manual Install
paths:
  /operations/nodes-manual-install:
    post:
      description: Install the node package manually.
      operationId: postNodeManualInstall
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/manual-install-request'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/install-config-file'
          description: successful operation
      summary: Manual node installation
      tags:
      - Operations - Nodes Manual Install
components:
  schemas:
    install-config-file:
      example:
        systemId: systemId
        configId: configId
        certFile: certFile
        clusterId: clusterId
        ports:
        - 0
        - 0
        managers:
        - managers
        - managers
        systemAccessToken: systemAccessToken
      properties:
        systemId:
          type: string
        clusterId:
          type: string
        configId:
          type: string
        systemAccessToken:
          type: string
        managers:
          items:
            type: string
          type: array
        ports:
          items:
            format: int32
            type: integer
          type: array
        certFile:
          type: string
      type: object
    manual-install-request:
      properties:
        systemId:
          description: Id of the system participating in the install
          type: string
        expirationDays:
          description: The number of days before the access token expires
          format: int32
          type: integer
        clusterOption:
          description: Cluster option for the host QGM cluster. Applicable for QueryGrid version 02.11+. The primary QGM cluster determines the version of the tdqg-node software to run on the data nodes and can run pre-02.09 versions of the QueryGrid fabric. It is always the first QGM cluster the tdqg-node service is configured to serve. The Secondary QGM clusters are always added after the tdqg-node service has been configured with a Primary QGM cluster. The tdqg-node software version selected by the secondary QueryGrid Manager cluster has no effect. The secondary QGM cluster cannot run pre-02.09 versions of the QueryGrid fabric.
          enum:
          - PRIMARY
          - SECONDARY
          - EXCLUSIVE_PRIMARY
          type:
          - string
          - 'null'
      type: object
  securitySchemes:
    BasicAuth:
      scheme: basic
      type: http
