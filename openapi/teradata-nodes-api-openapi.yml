openapi: 3.2.0
info:
  title: Teradata Nodes API
  x-refined-note:
  - x-generated-from differs across the merged source definitions and was not carried
  - x-last-validated differs across the merged source definitions and was not carried
  version: '1.0'
  description: 'Operations tagged Nodes across 2 of this provider''s published API definitions: teradata-querygrid-manager-api.yaml, tdqg-manager-api.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://querygrid.teradata.com/api/v1
  description: Default QueryGrid Manager endpoint
- description: Default API endpoint
  url: /api/v1
- description: Querygrid Prefix API endpoint
  url: /querygrid/api/v1
- description: Streaming Prefix API endpoint
  url: /querygrid-streaming/api/v1
security:
- BasicAuth: []
tags:
- name: Nodes
paths:
  /nodes:
    get:
      operationId: listNodes
      summary: Teradata List Nodes
      description: Retrieve all nodes with optional filtering by system and status.
      tags:
      - Nodes
      parameters:
      - name: systemId
        in: query
        description: Filter nodes by system identifier.
        schema:
          type: string
        example: sys-001
      - name: status
        in: query
        description: Filter nodes by status.
        schema:
          type: string
          enum:
          - active
          - inactive
          - error
        example: active
      responses:
        '200':
          description: List of nodes retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Node'
              examples:
                ListNodes200Example:
                  summary: Default listNodes 200 response
                  x-microcks-default: true
                  value:
                  - id: '600001'
                    name: node-east-01
                    hostname: node01.example.com
                    systemId: sys-001
                    status: active
                    softwareVersion: 03.06.00.01
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    delete:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_nodes_delete_request'
        description: Optional description in *Markdown*
        required: true
      responses:
        '200':
          description: node deleted
      summary: Bulk delete nodes
      tags:
      - Nodes
      operationId: deleteNodes
      x-operation-id-source: derived
    servers:
    - url: https://querygrid.teradata.com/api/v1
      description: Default QueryGrid Manager endpoint
  /nodes/{id}:
    delete:
      description: Delete a single node based on the Id supplied
      operationId: deleteNodeById
      parameters:
      - description: Id of node that needs to be deleted.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Node deleted
      summary: Delete node using Id
      tags:
      - Nodes
    get:
      description: Get the node using the Id
      operationId: getNodeById
      parameters:
      - description: Id of node to get
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/node'
          description: Successful Operation
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/not-found-entity'
          description: No node found with the specified Id
      summary: Find node by Id
      tags:
      - Nodes
    servers:
    - description: Default API endpoint
      url: /api/v1
    - description: Querygrid Prefix API endpoint
      url: /querygrid/api/v1
    - description: Streaming Prefix API endpoint
      url: /querygrid-streaming/api/v1
  /nodes/{id}/heartbeat:
    get:
      description: Get the last watchdog heartbeat using node Id
      operationId: getLastWatchDogHeartbeat
      parameters:
      - description: Id of node
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/watchdog-heartbeat'
          description: Successful Operation
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/not-found-entity'
          description: No node found with the specified Id
      summary: Get last watchdog heartbeat using node Id
      tags:
      - Nodes
    servers:
    - description: Default API endpoint
      url: /api/v1
    - description: Querygrid Prefix API endpoint
      url: /querygrid/api/v1
    - description: Streaming Prefix API endpoint
      url: /querygrid-streaming/api/v1
components:
  schemas:
    Node:
      type: object
      description: A node in the QueryGrid environment.
      properties:
        id:
          type: string
          description: Unique node identifier.
          example: '600001'
        name:
          type: string
          description: Node name.
          example: node-east-01
        hostname:
          type: string
          description: Node hostname.
          example: node01.example.com
        systemId:
          type: string
          description: Parent system identifier.
          example: sys-001
        status:
          type: string
          description: Node status.
          enum:
          - active
          - inactive
          - error
          example: active
        softwareVersion:
          type: string
          description: Installed software version.
          example: 03.06.00.01
    node__extraInfo:
      description: Information not part of the saved node schema but information that is associated and useful to know about the node.
      example:
        systemName: TD1
        startTime: 2000-01-23 04:56:07+00:00
        dataCenterName: San Diego
        softwareVersion: 02.04.00.02-11
        status: ONLINE
      properties:
        status:
          description: The status of the node (e.g. ONLINE or OFFLINE).
          example: ONLINE
          type: string
        startTime:
          description: The start time of the node service.
          format: date-time
          type: string
        systemName:
          description: The name of the system the node belongs to.
          example: TD1
        dataCenterName:
          description: The data center the node is located in.
          example: San Diego
        softwareVersion:
          description: The version of tdqg-node software the node is running
          example: 02.04.00.02-11
      type: object
