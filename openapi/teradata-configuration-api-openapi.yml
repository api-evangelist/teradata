    post:
      operationId: createBridge
      summary: Teradata Create Bridge
      description: Create a new bridge between systems.
      tags:
      - Configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Bridge'
      responses:
        '201':
          description: Bridge created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bridge'
        '400':
