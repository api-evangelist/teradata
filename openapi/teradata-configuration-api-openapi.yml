openapi: 3.2.0
info:
  title: Teradata QueryGrid Manager Configuration API
  description: REST API for centralized administration and monitoring of Teradata QueryGrid, the data fabric that enables seamless cross-system analytics. Manage data centers, systems, bridges, connectors, links, fabrics, networks, and node configurations.
  version: '3.6'
  contact:
    name: Teradata
    url: https://www.teradata.com
  x-generated-from: documentation
  x-last-validated: '2026-04-18'
servers:
- url: https://querygrid.teradata.com/api/v1
  description: Default QueryGrid Manager endpoint
security:
- BasicAuth: []
tags:
- name: Configuration
paths:
  /config/datacenters:
    get:
      operationId: listDataCenters
      summary: Teradata List Data Centers
      description: Retrieve all configured data centers.
      tags:
      - Configuration
      responses:
        '200':
          description: List of data centers retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DataCenter'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    post:
      operationId: createDataCenter
      summary: Teradata Create Data Center
      description: Create a new data center configuration.
      tags:
      - Configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataCenter'
            examples:
              CreateDataCenterRequestExample:
                summary: Default createDataCenter request
                x-microcks-default: true
                value:
                  name: dc-east-01
                  description: East coast primary data center
                  location: US-East
      responses:
        '201':
          description: Data center created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataCenter'
        '400':
          description: Invalid data center configuration.
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /config/systems:
    get:
      operationId: listSystems
      summary: Teradata List Systems
      description: Retrieve all configured systems.
      tags:
      - Configuration
      responses:
        '200':
          description: List of systems retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/System'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    post:
      operationId: createSystem
      summary: Teradata Create System
      description: Register a new system in QueryGrid.
      tags:
      - Configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/System'
      responses:
        '201':
          description: System created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/System'
        '400':
          description: Invalid system configuration.
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /config/bridges:
    get:
      operationId: listBridges
      summary: Teradata List Bridges
      description: Retrieve all configured bridges.
      tags:
      - Configuration
      responses:
        '200':
          description: List of bridges retrieved successfully.
          content:
