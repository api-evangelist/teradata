naftiko: 1.0.0-alpha2
info:
  label: Teradata QueryGrid Manager API — Queries
  description: 'Teradata QueryGrid Manager API — Queries. 1 operations. Lead operation: Teradata List Queries. Self-contained
    Naftiko capability covering one Teradata business surface.'
  tags:
  - Teradata
  - Queries
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TERADATA_API_KEY: TERADATA_API_KEY
capability:
  consumes:
  - type: http
    namespace: querygrid-manager-queries
    baseUri: https://querygrid.teradata.com/api/v1
    description: Teradata QueryGrid Manager API — Queries business capability. Self-contained, no shared references.
    resources:
    - name: queries
      path: /queries
      operations:
      - name: listqueries
        method: GET
        description: Teradata List Queries
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: basic
      username: '{{env.TERADATA_USER}}'
      password: '{{env.TERADATA_PASS}}'
  exposes:
  - type: rest
    namespace: querygrid-manager-queries-rest
    port: 8080
    description: REST adapter for Teradata QueryGrid Manager API — Queries. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/queries
      name: queries
      description: REST surface for queries.
      operations:
      - method: GET
        name: listqueries
        description: Teradata List Queries
        call: querygrid-manager-queries.listqueries
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: querygrid-manager-queries-mcp
    port: 9090
    transport: http
    description: MCP adapter for Teradata QueryGrid Manager API — Queries. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: teradata-list-queries
      description: Teradata List Queries
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: querygrid-manager-queries.listqueries
      outputParameters:
      - type: object
        mapping: $.
