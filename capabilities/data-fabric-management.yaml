naftiko: 1.0.0-alpha2
info:
  label: Teradata Data Fabric Management
  description: Workflow capability for managing Teradata's data fabric infrastructure. Combines QueryGrid Manager for fabric
    configuration with Query Service for validating cross-system connectivity. Used by data engineers and platform administrators.
  tags:
  - Teradata
  - Data Fabric
  - Configuration
  - Administration
  created: '2026-04-18'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    QUERYGRID_USERNAME: QUERYGRID_USERNAME
    QUERYGRID_PASSWORD: QUERYGRID_PASSWORD
    VANTAGE_USERNAME: VANTAGE_USERNAME
    VANTAGE_PASSWORD: VANTAGE_PASSWORD
capability:
  consumes:
  - type: http
    namespace: querygrid-manager
    baseUri: https://querygrid.teradata.com/api/v1
    description: QueryGrid Manager REST API for data fabric administration.
    authentication:
      type: basic
      username: '{{QUERYGRID_USERNAME}}'
      password: '{{QUERYGRID_PASSWORD}}'
    resources:
    - name: monitoring
      path: /
      description: Monitoring and status endpoints.
      operations:
      - name: get-api-info
        method: GET
        description: Retrieve API version and status information.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: list-issues
        method: GET
        description: Retrieve all current issues.
        inputParameters:
        - name: path
          in: path
          type: string
          required: true
          description: Issues endpoint path.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: configuration
      path: /config
      description: Configuration management endpoints.
      operations:
      - name: list-data-centers
        method: GET
        description: Retrieve all configured data centers.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-data-center
        method: POST
        description: Create a new data center configuration.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: list-systems
        method: GET
        description: Retrieve all configured systems.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-system
        method: POST
        description: Register a new system.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: list-bridges
        method: GET
        description: Retrieve all configured bridges.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: list-connectors
        method: GET
        description: Retrieve all configured connectors.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: list-links
        method: GET
        description: Retrieve all configured links.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: list-fabrics
        method: GET
        description: Retrieve all configured fabrics.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: list-networks
        method: GET
        description: Retrieve all configured networks.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: operations
      path: /operations
      description: Operational management endpoints.
      operations:
      - name: run-diagnostic-check
        method: POST
        description: Execute a diagnostic check.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: auto-install-nodes
        method: POST
        description: Trigger automated node installation.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  - type: http
    namespace: query-service
    baseUri: https://vantage.teradata.com/api/query/v1
    description: Teradata Query Service REST API.
    authentication:
      type: basic
      username: '{{VANTAGE_USERNAME}}'
      password: '{{VANTAGE_PASSWORD}}'
    resources:
    - name: systems
      path: /systems
      description: Available Vantage systems.
      operations:
      - name: list-systems
        method: GET
        description: List available Vantage systems.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: sessions
      path: /sessions
      description: Query sessions.
      operations:
      - name: create-session
        method: POST
        description: Create a new query session.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-session
        method: GET
        description: Get session details.
        inputParameters:
        - name: sessionId
          in: path
          type: string
          required: true
          description: Session identifier.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: delete-session
        method: DELETE
        description: Close a query session.
        inputParameters:
        - name: sessionId
          in: path
          type: string
          required: true
          description: Session identifier.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: queries
      path: /queries
      description: SQL query execution.
      operations:
      - name: execute-query
        method: POST
        description: Execute a SQL query.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-query-status
        method: GET
        description: Get query status and results.
        inputParameters:
        - name: queryId
          in: path
          type: string
          required: true
          description: Query identifier.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: data-fabric-api
    description: Unified REST API for Teradata data fabric management.
    resources:
    - path: /v1/data-centers
      name: data-centers
      description: Data center management.
      operations:
      - method: GET
        name: list-data-centers
        description: List all data centers.
        call: querygrid-manager.list-data-centers
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/systems
      name: systems
      description: System management.
      operations:
      - method: GET
        name: list-systems
        description: List all registered systems.
        call: querygrid-manager.list-systems
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/bridges
      name: bridges
      description: Bridge management.
      operations:
      - method: GET
        name: list-bridges
        description: List all bridges.
        call: querygrid-manager.list-bridges
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/issues
      name: issues
      description: Issue monitoring.
      operations:
      - method: GET
        name: list-issues
        description: List all current issues.
        call: querygrid-manager.list-issues
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9080
    namespace: data-fabric-mcp
    transport: http
    description: MCP server for AI-assisted data fabric management.
    tools:
    - name: list-data-centers
      description: List all configured data centers.
      hints:
        readOnly: true
      call: querygrid-manager.list-data-centers
      outputParameters:
      - type: object
        mapping: $.
    - name: list-systems
      description: List all registered systems in QueryGrid.
      hints:
        readOnly: true
      call: querygrid-manager.list-systems
      outputParameters:
      - type: object
        mapping: $.
    - name: list-bridges
      description: List all bridges connecting systems.
      hints:
        readOnly: true
      call: querygrid-manager.list-bridges
      outputParameters:
      - type: object
        mapping: $.
    - name: list-connectors
      description: List all connectors for system integration.
      hints:
        readOnly: true
      call: querygrid-manager.list-connectors
      outputParameters:
      - type: object
        mapping: $.
    - name: list-fabrics
      description: List all data fabric configurations.
      hints:
        readOnly: true
      call: querygrid-manager.list-fabrics
      outputParameters:
      - type: object
        mapping: $.
    - name: list-issues
      description: List all current issues in the QueryGrid environment.
      hints:
        readOnly: true
      call: querygrid-manager.list-issues
      outputParameters:
      - type: object
        mapping: $.
    - name: run-diagnostic-check
      description: Run a diagnostic check on QueryGrid systems.
      hints:
        readOnly: false
      call: querygrid-manager.run-diagnostic-check
      outputParameters:
      - type: object
        mapping: $.
