naftiko: 1.0.0-alpha2
info:
  label: Teradata Query Service API — Systems
  description: 'Teradata Query Service API — Systems. 1 operations. Lead operation: Teradata List Query Systems. Self-contained
    Naftiko capability covering one Teradata business surface.'
  tags:
  - Teradata
  - Systems
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TERADATA_API_KEY: TERADATA_API_KEY
capability:
  consumes:
  - type: http
    namespace: query-service-systems
    baseUri: https://vantage.teradata.com/api/query/v1
    description: Teradata Query Service API — Systems business capability. Self-contained, no shared references.
    resources:
    - name: systems
      path: /systems
      operations:
      - name: listquerysystems
        method: GET
        description: Teradata List Query Systems
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: basic
      username: '{{env.TERADATA_USER}}'
      password: '{{env.TERADATA_PASS}}'
  exposes:
  - type: rest
    namespace: query-service-systems-rest
    port: 8080
    description: REST adapter for Teradata Query Service API — Systems. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/systems
      name: systems
      description: REST surface for systems.
      operations:
      - method: GET
        name: listquerysystems
        description: Teradata List Query Systems
        call: query-service-systems.listquerysystems
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: query-service-systems-mcp
    port: 9090
    transport: http
    description: MCP adapter for Teradata Query Service API — Systems. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: teradata-list-query-systems
      description: Teradata List Query Systems
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: query-service-systems.listquerysystems
      outputParameters:
      - type: object
        mapping: $.
