naftiko: 1.0.0-alpha2
info:
  label: Teradata QueryGrid Manager API — Managers
  description: 'Teradata QueryGrid Manager API — Managers. 1 operations. Lead operation: Teradata List Managers. Self-contained
    Naftiko capability covering one Teradata business surface.'
  tags:
  - Teradata
  - Managers
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TERADATA_API_KEY: TERADATA_API_KEY
capability:
  consumes:
  - type: http
    namespace: querygrid-manager-managers
    baseUri: https://querygrid.teradata.com/api/v1
    description: Teradata QueryGrid Manager API — Managers business capability. Self-contained, no shared references.
    resources:
    - name: managers
      path: /managers
      operations:
      - name: listmanagers
        method: GET
        description: Teradata List Managers
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: basic
      username: '{{env.TERADATA_USER}}'
      password: '{{env.TERADATA_PASS}}'
  exposes:
  - type: rest
    namespace: querygrid-manager-managers-rest
    port: 8080
    description: REST adapter for Teradata QueryGrid Manager API — Managers. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/managers
      name: managers
      description: REST surface for managers.
      operations:
      - method: GET
        name: listmanagers
        description: Teradata List Managers
        call: querygrid-manager-managers.listmanagers
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: querygrid-manager-managers-mcp
    port: 9090
    transport: http
    description: MCP adapter for Teradata QueryGrid Manager API — Managers. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: teradata-list-managers
      description: Teradata List Managers
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: querygrid-manager-managers.listmanagers
      outputParameters:
      - type: object
        mapping: $.
