naftiko: 1.0.0-alpha2
info:
  label: Teradata Query Service API — Queries
  description: 'Teradata Query Service API — Queries. 3 operations. Lead operation: Teradata Execute Query. Self-contained
    Naftiko capability covering one Teradata business surface.'
  tags:
  - Teradata
  - Queries
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TERADATA_API_KEY: TERADATA_API_KEY
capability:
  consumes:
  - type: http
    namespace: query-service-queries
    baseUri: https://vantage.teradata.com/api/query/v1
    description: Teradata Query Service API — Queries business capability. Self-contained, no shared references.
    resources:
    - name: queries
      path: /queries
      operations:
      - name: executequery
        method: POST
        description: Teradata Execute Query
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: queries-queryId
      path: /queries/{queryId}
      operations:
      - name: getquerystatus
        method: GET
        description: Teradata Get Query Status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: queryId
          in: path
          type: string
          description: Query identifier.
          required: true
      - name: cancelquery
        method: DELETE
        description: Teradata Cancel Query
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: queryId
          in: path
          type: string
          description: Query identifier.
          required: true
    authentication:
      type: basic
      username: '{{env.TERADATA_USER}}'
      password: '{{env.TERADATA_PASS}}'
  exposes:
  - type: rest
    namespace: query-service-queries-rest
    port: 8080
    description: REST adapter for Teradata Query Service API — Queries. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/queries
      name: queries
      description: REST surface for queries.
      operations:
      - method: POST
        name: executequery
        description: Teradata Execute Query
        call: query-service-queries.executequery
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/queries/{queryid}
      name: queries-queryid
      description: REST surface for queries-queryId.
      operations:
      - method: GET
        name: getquerystatus
        description: Teradata Get Query Status
        call: query-service-queries.getquerystatus
        with:
          queryId: rest.queryId
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: cancelquery
        description: Teradata Cancel Query
        call: query-service-queries.cancelquery
        with:
          queryId: rest.queryId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: query-service-queries-mcp
    port: 9090
    transport: http
    description: MCP adapter for Teradata Query Service API — Queries. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: teradata-execute-query
      description: Teradata Execute Query
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: query-service-queries.executequery
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: teradata-get-query-status
      description: Teradata Get Query Status
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: query-service-queries.getquerystatus
      with:
        queryId: tools.queryId
      outputParameters:
      - type: object
        mapping: $.
    - name: teradata-cancel-query
      description: Teradata Cancel Query
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: query-service-queries.cancelquery
      with:
        queryId: tools.queryId
      outputParameters:
      - type: object
        mapping: $.
