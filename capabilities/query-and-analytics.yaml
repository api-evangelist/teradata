naftiko: 1.0.0-alpha2
info:
  label: Teradata Query and Analytics
  description: Workflow capability for executing SQL queries and analytics against Teradata Vantage systems. Combines Query
    Service for SQL execution with QueryGrid for cross-system query monitoring. Used by data analysts and application developers.
  tags:
  - Teradata
  - Query
  - Analytics
  - SQL
  created: '2026-04-18'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    VANTAGE_USERNAME: VANTAGE_USERNAME
    VANTAGE_PASSWORD: VANTAGE_PASSWORD
    QUERYGRID_USERNAME: QUERYGRID_USERNAME
    QUERYGRID_PASSWORD: QUERYGRID_PASSWORD
capability:
  consumes:
  - type: http
    namespace: query-service
    baseUri: https://vantage.teradata.com/api/query/v1
    description: Teradata Query Service REST API.
    authentication:
      type: basic
      username: '{{VANTAGE_USERNAME}}'
      password: '{{VANTAGE_PASSWORD}}'
    resources:
    - name: systems
      path: /systems
      description: Available Vantage systems.
      operations:
      - name: list-systems
        method: GET
        description: List available Vantage systems.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: sessions
      path: /sessions
      description: Query sessions.
      operations:
      - name: create-session
        method: POST
        description: Create a new query session.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-session
        method: GET
        description: Get session details.
        inputParameters:
        - name: sessionId
          in: path
          type: string
          required: true
          description: Session identifier.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: delete-session
        method: DELETE
        description: Close a query session.
        inputParameters:
        - name: sessionId
          in: path
          type: string
          required: true
          description: Session identifier.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: queries
      path: /queries
      description: SQL query execution.
      operations:
      - name: execute-query
        method: POST
        description: Execute a SQL query.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-query-status
        method: GET
        description: Get query status and results.
        inputParameters:
        - name: queryId
          in: path
          type: string
          required: true
          description: Query identifier.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  - type: http
    namespace: querygrid-manager
    baseUri: https://querygrid.teradata.com/api/v1
    description: QueryGrid Manager REST API for data fabric administration.
    authentication:
      type: basic
      username: '{{QUERYGRID_USERNAME}}'
      password: '{{QUERYGRID_PASSWORD}}'
    resources:
    - name: monitoring
      path: /
      description: Monitoring and status endpoints.
      operations:
      - name: get-api-info
        method: GET
        description: Retrieve API version and status information.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: list-issues
        method: GET
        description: Retrieve all current issues.
        inputParameters:
        - name: path
          in: path
          type: string
          required: true
          description: Issues endpoint path.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: configuration
      path: /config
      description: Configuration management endpoints.
      operations:
      - name: list-data-centers
        method: GET
        description: Retrieve all configured data centers.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-data-center
        method: POST
        description: Create a new data center configuration.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: list-systems
        method: GET
        description: Retrieve all configured systems.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-system
        method: POST
        description: Register a new system.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: list-bridges
        method: GET
        description: Retrieve all configured bridges.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: list-connectors
        method: GET
        description: Retrieve all configured connectors.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: list-links
        method: GET
        description: Retrieve all configured links.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: list-fabrics
        method: GET
        description: Retrieve all configured fabrics.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: list-networks
        method: GET
        description: Retrieve all configured networks.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: operations
      path: /operations
      description: Operational management endpoints.
      operations:
      - name: run-diagnostic-check
        method: POST
        description: Execute a diagnostic check.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: auto-install-nodes
        method: POST
        description: Trigger automated node installation.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8081
    namespace: query-analytics-api
    description: Unified REST API for Teradata query and analytics.
    resources:
    - path: /v1/systems
      name: systems
      description: Available systems.
      operations:
      - method: GET
        name: list-query-systems
        description: List available Vantage systems.
        call: query-service.list-systems
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/sessions
      name: sessions
      description: Query sessions.
      operations:
      - method: POST
        name: create-session
        description: Create a query session.
        call: query-service.create-session
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/queries
      name: queries
      description: SQL queries.
      operations:
      - method: POST
        name: execute-query
        description: Execute a SQL query.
        call: query-service.execute-query
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9081
    namespace: query-analytics-mcp
    transport: http
    description: MCP server for AI-assisted SQL query execution.
    tools:
    - name: list-query-systems
      description: List available Vantage systems for query execution.
      hints:
        readOnly: true
      call: query-service.list-systems
      outputParameters:
      - type: object
        mapping: $.
    - name: create-session
      description: Create a new query session on a Vantage system.
      hints:
        readOnly: false
      call: query-service.create-session
      outputParameters:
      - type: object
        mapping: $.
    - name: execute-query
      description: Execute a SQL query against Teradata Vantage.
      hints:
        readOnly: false
      call: query-service.execute-query
      outputParameters:
      - type: object
        mapping: $.
    - name: get-query-status
      description: Get the status and results of a submitted query.
      hints:
        readOnly: true
      call: query-service.get-query-status
      outputParameters:
      - type: object
        mapping: $.
    - name: list-querygrid-queries
      description: List cross-system query summaries from QueryGrid.
      hints:
        readOnly: true
      call: querygrid-manager.list-issues
      outputParameters:
      - type: object
        mapping: $.
