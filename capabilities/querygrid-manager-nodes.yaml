naftiko: 1.0.0-alpha2
info:
  label: Teradata QueryGrid Manager API — Nodes
  description: 'Teradata QueryGrid Manager API — Nodes. 1 operations. Lead operation: Teradata List Nodes. Self-contained
    Naftiko capability covering one Teradata business surface.'
  tags:
  - Teradata
  - Nodes
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TERADATA_API_KEY: TERADATA_API_KEY
capability:
  consumes:
  - type: http
    namespace: querygrid-manager-nodes
    baseUri: https://querygrid.teradata.com/api/v1
    description: Teradata QueryGrid Manager API — Nodes business capability. Self-contained, no shared references.
    resources:
    - name: nodes
      path: /nodes
      operations:
      - name: listnodes
        method: GET
        description: Teradata List Nodes
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: systemId
          in: query
          type: string
          description: Filter nodes by system identifier.
        - name: status
          in: query
          type: string
          description: Filter nodes by status.
    authentication:
      type: basic
      username: '{{env.TERADATA_USER}}'
      password: '{{env.TERADATA_PASS}}'
  exposes:
  - type: rest
    namespace: querygrid-manager-nodes-rest
    port: 8080
    description: REST adapter for Teradata QueryGrid Manager API — Nodes. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/nodes
      name: nodes
      description: REST surface for nodes.
      operations:
      - method: GET
        name: listnodes
        description: Teradata List Nodes
        call: querygrid-manager-nodes.listnodes
        with:
          systemId: rest.systemId
          status: rest.status
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: querygrid-manager-nodes-mcp
    port: 9090
    transport: http
    description: MCP adapter for Teradata QueryGrid Manager API — Nodes. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: teradata-list-nodes
      description: Teradata List Nodes
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: querygrid-manager-nodes.listnodes
      with:
        systemId: tools.systemId
        status: tools.status
      outputParameters:
      - type: object
        mapping: $.
