naftiko: 1.0.0-alpha2
info:
  label: Teradata Query Service API — Sessions
  description: 'Teradata Query Service API — Sessions. 3 operations. Lead operation: Teradata Create Session. Self-contained
    Naftiko capability covering one Teradata business surface.'
  tags:
  - Teradata
  - Sessions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TERADATA_API_KEY: TERADATA_API_KEY
capability:
  consumes:
  - type: http
    namespace: query-service-sessions
    baseUri: https://vantage.teradata.com/api/query/v1
    description: Teradata Query Service API — Sessions business capability. Self-contained, no shared references.
    resources:
    - name: sessions
      path: /sessions
      operations:
      - name: createsession
        method: POST
        description: Teradata Create Session
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: sessions-sessionId
      path: /sessions/{sessionId}
      operations:
      - name: getsession
        method: GET
        description: Teradata Get Session
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: sessionId
          in: path
          type: string
          description: Session identifier.
          required: true
      - name: deletesession
        method: DELETE
        description: Teradata Delete Session
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: sessionId
          in: path
          type: string
          description: Session identifier.
          required: true
    authentication:
      type: basic
      username: '{{env.TERADATA_USER}}'
      password: '{{env.TERADATA_PASS}}'
  exposes:
  - type: rest
    namespace: query-service-sessions-rest
    port: 8080
    description: REST adapter for Teradata Query Service API — Sessions. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/sessions
      name: sessions
      description: REST surface for sessions.
      operations:
      - method: POST
        name: createsession
        description: Teradata Create Session
        call: query-service-sessions.createsession
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/sessions/{sessionid}
      name: sessions-sessionid
      description: REST surface for sessions-sessionId.
      operations:
      - method: GET
        name: getsession
        description: Teradata Get Session
        call: query-service-sessions.getsession
        with:
          sessionId: rest.sessionId
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletesession
        description: Teradata Delete Session
        call: query-service-sessions.deletesession
        with:
          sessionId: rest.sessionId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: query-service-sessions-mcp
    port: 9090
    transport: http
    description: MCP adapter for Teradata Query Service API — Sessions. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: teradata-create-session
      description: Teradata Create Session
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: query-service-sessions.createsession
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: teradata-get-session
      description: Teradata Get Session
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: query-service-sessions.getsession
      with:
        sessionId: tools.sessionId
      outputParameters:
      - type: object
        mapping: $.
    - name: teradata-delete-session
      description: Teradata Delete Session
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: query-service-sessions.deletesession
      with:
        sessionId: tools.sessionId
      outputParameters:
      - type: object
        mapping: $.
